# Render Blueprint — despliegue automático del sistema (100% gratis).
#
# Al conectar este repositorio en Render.com, Render lee este archivo
# y crea el servicio web + la base de datos PostgreSQL gratis sin más
# configuración manual.
#
# Enlaces de ayuda:
#   - Blueprint: https://render.com/docs/infrastructure-as-code
#   - Plan gratis: 750 h/mes de servicio web + 90 días de PostgreSQL gratuito.
services:
  - type: web
    name: control-alimentos
    runtime: python
    plan: free
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --workers 1 --threads 2 --timeout 90 --access-logfile -"
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: control-alimentos-db
          property: connectionString
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: ADMIN_ROL
        value: admin
      - key: CREATE_ADMIN_ON_START
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: control-alimentos-db
    plan: free
    region: ohio