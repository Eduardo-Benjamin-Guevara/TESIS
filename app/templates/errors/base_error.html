<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ titulo }} | Control de Alimentos I.E.I. 1488</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">
    <script>
        // Aplicar el tema antes de que se pinte la página (evita parpadeo)
        (function () {
            try {
                var t = localStorage.getItem("tema");
                if (!t) {
                    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
                }
                if (t === "oscuro") { document.documentElement.setAttribute("data-tema", "oscuro"); }
            } catch (e) {}
        })();
    </script>
    <div class="auth-wrapper">
        <div class="text-center error-box">
            <div class="error-code">{{ codigo }}</div>
            <i class="bi {{ icono }} error-icon" aria-hidden="true"></i>
            <h1 class="h4 fw-bold mt-3">{{ titulo }}</h1>
            <p class="text-muted">{{ mensaje }}</p>
            <div class="d-flex gap-2 justify-content-center flex-wrap mt-2">
                <a href="{{ url_for('main.panel') }}" class="btn btn-primary">
                    <i class="bi bi-house me-1" aria-hidden="true"></i> Ir al panel
                </a>
                <button type="button" onclick="history.back()" class="btn btn-outline-secondary" data-no-loading>
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i> Volver atrás
                </button>
            </div>
        </div>
    </div>
</body>
</html>
