<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | Sistema de Alimentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="text-center error-box">
            <div class="error-code">{{ codigo }}</div>
            <i class="bi {{ icono }} error-icon"></i>
            <h1 class="h4 fw-bold mt-3">{{ titulo }}</h1>
            <p class="text-muted">{{ mensaje }}</p>
            <a href="{{ url_for('main.panel') }}" class="btn btn-primary mt-2">
                <i class="bi bi-house me-1"></i> Volver al panel
            </a>
        </div>
    </div>
</body>
</html>
